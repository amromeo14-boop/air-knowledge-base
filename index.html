{cat:"Escalation & Case Handling", title:"Dispute/Escalation Expectations (Tina Ladson guidance)", tags:"escalation expectations dollar threshold 200 legal exposure precedent regulatory bbb social media", priority:true,
 body:`<h4>Direct answer</h4><p>You have discretion to resolve small-dollar disputes yourself. Loop in Jared and Tina for anything with real risk or visibility.</p>
 <h4>Self-resolve without approval</h4><ul><li>Disputes of $200 or less, where we can't substantiate our position with documentation and continued escalation costs more than the amount in dispute — use sound business judgment to resolve. Not every case needs to be escalated for approval.</li></ul>
 <h4>Must loop in Jared &amp; Tina when...</h4><ul>
 <li>There is potential legal exposure</li>
 <li>The facts are unclear or disputed</li>
 <li>You believe an exception may be warranted</li>
 <li>There is media, BBB, regulatory, or social media exposure</li>
 <li>There's potential precedent-setting risk</li>
 <li>You're uncertain on the appropriate path forward</li>
 <li>The amount in dispute is significant</li>
 </ul>
 <div class="quote">"Most importantly, if an issue has executive visibility or the potential to become an executive escalation, I need to be informed immediately." — Tina Ladson</div>
 <h4>Source</h4><p class="src">CCAMS Escalation & Resolution Expectations, 6/16/26 (T. Ladson email)</p>`},

{cat:"Escalation & Case Handling", title:"CCAMS Priority List & Daily Workflow Rules", tags:"priority list initial air pac settlement pay ready account notes duplicated email",
 body:`<h4>Priority order for working accounts</h4><ul>
 <li>1. Initial AIR Accounts</li>
 <li>2. PAC Accounts</li>
 <li>3. Settlement Campaign Accounts</li>
 <li>4. Pay Ready Accounts</li></ul>
 <h4>Before working any case</h4><ul><li>Always read account notes first before proceeding on a case.</li>
 <li>Check for duplicated emails in a thread to stay updated on account info/inquiries.</li></ul>
 <h4>Email process reminders</h4><ul>
 <li>If sending an escalation/legal-involvement email, loop in Jared and Tina on the thread.</li>
 <li>If it's a priority email they need to see immediately, send from your personal email (not the CCAMS shared inbox) — increases visibility on the thread.</li>
 <li>Avoid back-and-forth: anticipate the next likely questions and answer them proactively.</li>
 <li>Be confident — we are subject matter experts.</li>
 <li>Archive emails once completed; don't leave them sitting in inbox. If needed for later, make a subfolder or upload to the account with a calendar reminder.</li></ul>
 <h4>Out-of-scope requests</h4><p>If asked to assist on something outside your scope, refer the requester to the appropriate party. Loop in team leads, Jared, or Tina if requests persist or you need general guidance.</p>
 <h4>Team chat etiquette</h4><ul><li>For a CBR request in chat, delete the request once handled — keep the chat clean.</li>
 <li>Watch for remote teammates' assistance requests — chime in if you know or think you know the answer.</li>
 <li>Need immediate support? Tag someone to hop on a call if they're marked "green" (available).</li></ul>`},

{cat:"Escalation & Case Handling", title:"PAC Accounts – Required Language", tags:"pac speaking on behalf of language phrasing transition",
 body:`<h4>Direct answer</h4><p>When speaking with PAC (Preferred Apartment Communities) customers, always say we are <strong>"speaking on behalf of PAC."</strong> Never state that we are PAC — only that we work on behalf of them.</p>
 <h4>Related</h4><p>Tina and Jared circulate a transition accounts list showing upcoming units/communities coming into AIR, transition dates, and previous management details, to help set workflow expectations.</p>`},

{cat:"Refunds", title:"Refund Reissue Workflow & Turnaround", tags:"refund reissue workflow turnaround 2nd request accounting cc email", priority:true,
 body:`<h4>Direct answer</h4><p>Target resolution for refund reissue requests: 2–3 business days whenever possible.</p>
 <h4>Step-by-step</h4><ol>
 <li>Send the standard refund request email; CC the accounting contact's personal email if the request is urgent.</li>
 <li>If no response after 3 business days, send a 2nd request. Subject line format: <em>"2nd Request – CCAMSSD - PSID - Community Name - Resident Name - Unit - Refund Amount"</em></li>
 <li>Always confirm the customer's updated address before submitting a reissue request (for e-payments); include the verified address in the reissue email to accounting.</li>
 <li>Accounting confirms receipt of the refund request after the 2nd request is sent.</li>
 </ol>
 <h4>Things to verify</h4><ul><li>Forwarding/updated address is current</li><li>Whether Ken's approval is required for the check run (if yes, it processes once approved, no fixed date; if no, next settlement run is typically within 2 business days)</li></ul>
 <h4>Exceptions/notes</h4><ul><li>Forms currently in use are acceptable — no updates needed.</li><li>Paper checks now carry a 90-day stale date.</li></ul>
 <h4>Follow-up cadence</h4><p>General reminder: follow up on any refund request every 3 days if no response.</p>`},

{cat:"Refunds", title:"Lost Check — Reissuance Documentation Requirements", tags:"lost check affidavit void form vendor form 500 documentation reissue",
 body:`<h4>Direct answer</h4><p>Documentation required depends on the check amount and whether the check is physically in-office.</p>
 <h4>Lost check above $500</h4><ul><li>Lost Check Affidavit (LCA) — signed by customer</li><li>Void Form</li><li>Vendor Form</li><li>Verify resident's forwarding address in the email</li></ul>
 <h4>Lost check under $500</h4><ul><li>Void Form</li><li>Vendor Form</li><li>Verify resident's forwarding address in the email</li></ul>
 <h4>Physical check is in office but needs reissuance</h4><ul><li>Scanned copy of the check — after scanning, upload the copy to the email and account docs, then securely shred the physical copy</li><li>Void Form</li><li>Vendor Form</li><li>Verify resident's forwarding address in the email</li></ul>`},

{cat:"Refunds", title:"Timing for Reissues on Lost Checks / E-Payment Link Expiry", tags:"lost check timing 15 21 days e-payment link expired pay choice",
 body:`<h4>Direct answer</h4><p>If an e-payment link expires or incorrect info is entered during redemption, the system automatically switches to issuing a paper check to the address on file.</p>
 <h4>Things to verify</h4><ul><li>Allow the standard 15–21 day processing and delivery timeframe before taking any action if the check hasn't arrived yet — this window is required before further action.</li></ul>`},

{cat:"Refunds", title:"E-Payment Link (Pay Choice) Process", tags:"e-payment pay choice link email spam junk lease id electronic refund illinois",
 body:`<h4>Direct answer</h4><p>Refunds are sent via an email link from Pay Choice. Subject line: <em>"AIR Communities - [Property name] is trying to send you a payment."</em></p>
 <h4>What the customer needs</h4><ul><li>Their lease ID number handy when accessing the link</li><li>They choose how they'd like to receive the refund</li></ul>
 <h4>Common mistake / verify</h4><p>Have the customer check junk/spam folder if the email doesn't appear in the inbox.</p>
 <h4>Exception</h4><p>All states except Illinois (IL) get electronic refunds — IL is excluded from this method.</p>`},

{cat:"Refunds", title:"Mailing Refund Checks — FedEx Overnight", tags:"fedex overnight tracking mailing envelope",
 body:`<h4>Direct answer</h4><p>FedEx Overnight is used for tracked overnight mailing via a FedEx envelope.</p>
 <h4>Step-by-step</h4><ol><li>Log into the FedEx Overnight account: fedex.com secure login</li>
 <li>Fill out the FedEx Overnight page with resident name, address, phone, email as contact details</li>
 <li>Once all details are inserted, print the generated slip and put it on the front of the envelope</li>
 <li>Add the FedEx tracking number at the end of your mailing check note</li></ol>`},

{cat:"Refunds", title:"Mailing Refund Checks — Florida (Certified Mail)", tags:"florida fl certified mail usps tracking slip activity note rio-mail",
 body:`<h4>Direct answer</h4><p>Properties in FL require USPS Certified Mail (not standard/FedEx) for refund/FAS mailings.</p>
 <h4>Step-by-step</h4><ol>
 <li>Fill out the certification slip: To (resident name), 1st line (street + apt#), 2nd line (city, state, zip)</li>
 <li>Stuff the envelope as usual, then stick the certified mailing slip on the outside front — align the white dotted line with the top crease of the envelope</li>
 <li>Fold the top portion of the tracking slip to the back; keep the bottom portion visible on the front</li>
 <li>Retain slips for 60 days, filed by date mailed</li>
 </ol>
 <h4>Standard activity notes to use</h4><ul>
 <li><code>RIO-MAIL uploaded FAS / Stamped CertRec</code></li>
 <li><code>RIO-MAIL REFUND INV#XXXXXXXXXX $XXXXX Ck Date XX/XX/XXXX (MAILED CHECK XX/XX) Tracking #</code></li>
 <li><code>RIO-REFUND RESEND CK #XXXXXXXXXX $XXXXX Ck Date MM/DD/YYYY (MAILED CHECK MM/DD) Uploaded copy of check</code></li>
 <li><code>RIO-MAIL APPLICANT REFUND CK #XXXXXXXXXX $XXXXX (Mailed check to leasing office XXXX) Uploaded copy of check</code></li>
 <li>Returned FAS: <code>RIO-RENT rcvd the FAS returned by the post office as Unable to Forward — Copy saved under NTV/Resident Correspondence</code></li>
 <li>Returned refund: <code>RIO-REFUND RETURNED - TT XXXXX Sent email - awaiting ACH forms to send refund to bank</code></li>
 </ul>`},

{cat:"Refunds", title:"Account Notes Formatting — Checks", tags:"account notes note format returned check mailed check tracking",
 body:`<h4>When a mailed check is returned</h4><p>Note is entered by the Payment Processing Department: <code>RIO-RENT RETURNED PNC CHECK #xxxxxxxxxx DATE: x/xx/xx AMOUNT: $xxx.xx</code></p>
 <h4>When mailing out a check</h4><p><code>RIO-MAIL REFUND CK #XXXXXXXXXX $XXX.XX Ck Date XX/XX/XX (MAILED CHECK XX/XX/XXXX)</code></p>
 <h4>When mailing with tracking #</h4><p><code>RIO-MAIL REFUND CK #XXXXXXXXXX $XXX.XX Ck Date XX/XX/XX (MAILED CHECK XX/XX/XXXX) (Insert Tracking #)</code></p>`},

{cat:"Escalation & Case Handling", title:"Insufficient Notice Fee — Follow the Lease", tags:"insufficient notice fee 30 day 60 day lease terms FAQ",
 body:`<h4>Q&A</h4><p><strong>Q:</strong> Can I remove the insufficient notice fee when the lease on file states a 30-day notice requirement, but the resident was charged based on 60 days?</p>
 <p><strong>A:</strong> Yes — follow the lease on file. If it states 30 days, go with 30. Edit the charge to reflect the accurate number of days.</p>`},

{cat:"Escalation & Case Handling", title:"Rent Acceleration — Guarantor / Deceased Primary Resident", tags:"rent acceleration guarantor primary resident dies death sensitive re-rented",
 body:`<h4>Q&A</h4><p><strong>Q:</strong> If there is a guarantor on the lease and the primary resident dies, are we still charging rent acceleration?</p>

{cat:"Transfers & Relocation", title:"Cortland Relocation Guarantee — Transfer to a Cortland Community", tags:"cortland relocation guarantee transfer fee 500 six months background credit",
 body:`<h4>Direct answer</h4><p>Cortland residents can transfer to another Cortland community with a simple process, under set eligibility rules.</p>
 <h4>Standard rules</h4><ul>
 <li>Resident must fulfill at least 6 months of the current lease agreement.</li>
 <li>Transfer after 6 months of residency = no transfer fee. Transfer within first 6 months = transfer fee required.</li>
 <li>If the lease has expired, or it's a forced transfer due to renovation, transfer fees are waived.</li>
 <li>Guarantee does not apply to any Cortland community less than 10 miles from the current/originating community.</li>
 <li>If a transfer fee applies, use the amount stated in the lease agreement. Cortland's website lists $500 as the standard fee; if the lease is silent or you have questions, contact the Director of Operations.</li>
 <li>All lease termination fees (per the lease), application fees, and admin fees are waived.</li>
 <li>Resident must pay the required security deposit for the new community, if applicable. Any current deposit is refunded within 30 days of move-out.</li>
 <li>Background/credit application is required on transfers.</li>
 <li>Resident has 72 hours / 3 days to transfer without being charged rent on the transferring apartment (use GL code 4067 – Concessions Transfers to waive). Days beyond that are the resident's responsibility.</li>
 <li>If adding a roommate during transfer, the new roommate must qualify and pay an application fee.</li>
 <li>The transfer agreement must be signed by the resident and the Community Manager of the existing community before the transfer, and sent to the new community.</li>
 </ul>
 <h4>Step-by-step (Task Breakdown)</h4><ol>
 <li>Resident completes the Relocation/Transfer Request form and provides a Notice to Vacate per the lease (60-day notice).</li>
 <li>Conduct a pre-walk inspection of the current apartment to confirm acceptable condition.</li>
 <li>Confirm resident is in "good standing" (no late payments, complaints, etc.).</li>
 <li>Collect all balances (damages, cleaning charges, etc.) before approving the transfer.</li>
 <li>Notify the resident they're approved to transfer.</li>
 <li>Instruct resident to contact the new community to complete the application process.</li>
 <li>Send copies of the Transfer Request form to the new community.</li>
 <li>Ensure all paperwork is signed by resident(s) and management.</li>
 <li>Send paperwork to the new community.</li>
 <li>Resident signs a lease at the new community.</li>
 </ol>
 <h4>Related materials</h4><p>Relocation Checklist; Relocation Request form; SOE 106 Relocation Transfer Request to a Cortland Community; SOE 106.108 Resident Transfer Internal Checklist.</p>
 <h4>Source</h4><p class="src">Cortland SOE 106 — Relocation Guarantee</p>`},

{cat:"Deposit Alternatives", title:"Obligo — Security Deposit Alternative", tags:"obligo third party security deposit alternative claim overpay refund",
 body:`<h4>What is it</h4><p>Obligo is a 3rd-party security deposit alternative program residents can enroll in at application. If a resident moves out with an Obligo claim, Obligo pays either a portion or the full remaining balance owed to the community.</p>
 <h4>Important</h4><ul><li>Once an Obligo claim is submitted, it cannot be cancelled or returned without processing the funds.</li>
 <li>If the resident overpays the account, any refund due goes back to Obligo — NOT to the resident.</li></ul>
 <h4>Q&A</h4><p><strong>Q:</strong> For Obligo emails, can we just archive it or do we still need to assign it?</p><p><strong>A:</strong> Archive it.</p>
 <p>Website: myobligo.com</p>`},

{cat:"Settlement & Collections", title:"Settlement Release Form — DocuSign Process", tags:"settlement release form docusign 48 hours void deadline archive", priority:true,
 body:`<h4>Direct answer</h4><p>The release form must be signed/dated via DocuSign and returned within 48 business hours of the settlement offer, or the offer may become void.</p>
 <h4>Things to verify</h4><ul><li>Resident portal balance will NOT reflect the new settlement amount, since the settlement is a reduced final payment without fee removal — this needs to be explained to the resident to avoid confusion.</li></ul>
 <h4>Step-by-step (after payment received)</h4><ol><li>Confirm payment has been made.</li><li>Confirm the signed release form has been returned.</li><li>Provide the customer the settlement/satisfaction letter.</li></ol>
 <h4>Q&A</h4><p><strong>Q:</strong> A customer is demanding a copy of the fully signed settlement release form — should they already have their copy?</p>
 <p><strong>A:</strong> Correct, it's archived in our DocuSign as well — they should have their copy.</p>
 <h4>Related documents</h4><p>Settlement Letter (template); Settlement Worksheet (also documents step-by-step on how to pull the settlement Excel sheet via PowerBI, update the email template in Entrata, and pull docs for sale).</p>`},

{cat:"Unit Marketing", title:"Unit Marketing Explanation — Standard Customer Response", tags:"unit marketing explanation website advertising floorplan availability template",
 body:`<h4>Purpose</h4><p>Use when a customer asks why their old/specific unit isn't being marketed/wasn't shown to prospects.</p>
 <h4>Standard template language</h4><div class="quote">"Online advertisements draw substantially more prospects than website advertising... We do not list all available unit numbers of a single floorplan on the property websites, instead preferring to show an example of each floorplan available. When prospects visit the community, our sales team uses real-time availability reports to guide prospects to the best fit based on their individual needs. Prospects rarely apply for units online without talking to our sales team members."</div>
 <h4>Related</h4><p>SCRA Concession Recoupment Legal Advisement: do not recoup concessions for early termination under SCRA (military).</p>`},

{cat:"Lease / Concessions", title:"Concession Addendum Consideration", tags:"concession addendum push back credit signed lease agreement early termination",
 body:`<h4>Direct answer</h4><p>We will push back if the concession addendum isn't signed. If the customer pushes back because the addendum wasn't signed, we can credit it back.</p>
 <h4>Per the lease agreement (early termination language)</h4><p>If Resident terminates the Lease, Resident is entitled only to a refund of the Deposit and pre-paid Rent, and the Lease becomes null and void. Resident does not have the right to abate rent or terminate for cleaning/repair delays that don't prevent occupancy. If Landlord provides a rent concession/abatement, the same is not a waiver of Landlord's right to collect full rent for any other month, if: Resident pays the Early Termination Option Fee and any rent concession before the early termination date.</p>`},

{cat:"Move-Out & Charges", title:"Manual Move-Out Reconciliation Form — Line Items", tags:"move out reconciliation form fmo credits charges security deposit concession charge back",
 body:`<h4>What it captures</h4><p>Community name, property #, unit #, move-out date, lease dates, MTM status, and move-out reason (on-site transfer / coast-to-coast transfer / military transfer).</p>
 <h4>Credits</h4><ul><li>Security deposit on hand</li><li>Deposit interest due (state-mandated)</li><li>Pet deposit on hand</li><li>Rent refund</li></ul>
 <h4>Charges</h4><ul><li>Delinquent rent / late charges / MTM fees due</li><li>Concession charge back</li><li>Lease termination fee (Mo. Rent x 100%) / fee paid</li><li>Transfer fee / fee paid</li><li>Unpaid utility charges</li><li>Repair charges (itemized)</li><li>Cleaning charges (general, bulk item removal, carpet cleaning)</li><li>Painting charges (scuffs/stains, itemized)</li><li>Replacement charges (itemized)</li><li>Other (itemized)</li></ul>
 <h4>Outcome language</h4><p>If credits exceed charges: refund check processed, mailed within 10 business days. If charges exceed credits: balance due, payment accepted as money order or cashier's check only; unpaid balances go to collections and may affect credit history.</p>`},

{cat:"Move-Out & Charges", title:"Interest on Security Deposit — After Ledger Adjustment", tags:"interest security deposit adjustment short term renewal fee re-add ledger",
 body:`<h4>Q&A</h4><p><strong>Q:</strong> Resident paid 2 deposits and had 2 interest line items on security deposit; after a short-term renewal fee adjustment, one interest line disappeared. Why?</p>

{cat:"Move-Out & Charges", title:"Re-Rent Account Templates & Timing", tags:"re rent account template rentadd fillable rent acceleration re rented lease end date",

{cat:"Settlement & Collections", title:"Settlement Discount Authority by Account Age (CCAMS Processes Manual)", tags:"settlement percent off 25% 50% 90% aged account authority approval discount", priority:true,
 body:`<h4>Direct answer</h4><p>How much a Collections Specialist can discount a balance without escalating depends on how old the account is and its balance size.</p>
 <h4>Authority tiers</h4><ul>
 <li>Within 45 days of placement: any CS can offer up to <strong>25% off</strong> the full balance.</li>
 <li>If the balance is under $1,000: a CS can offer up to <strong>50% off</strong>, regardless of age.</li>
 <li>After 90 days, the account is reassigned to a different agent, who can offer <strong>60%–95% off</strong> — starting at the lowest percentage and working up in 5–10% increments as needed.</li>
 </ul>
 <h4>Related</h4><p>Vanessa Valdivia (Team Lead) has authority to approve settlements/long-term plans between 25%–30% off. See "CCAMS Team Roles & Escalation Contacts" for the full approval chain.</p>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"Settlement & Collections", title:"Payment Plan Conditions & Approval Tiers (CCAMS Processes Manual)", tags:"payment plan conditions 30 days 100 minimum 12 24 36 months approval jared vanessa jacqui shapiro", priority:true,
 body:`<h4>Base conditions (any CS can set these up)</h4><ul>
 <li>Payments can't be more than 30 days apart.</li>
 <li>Minimum payment is $100/month (biweekly payments totaling at least $100/month are fine).</li>
 <li>Must result in payment in full within <strong>12–24 months</strong>.</li>
 </ul>
 <h4>Needs manager approval first</h4><ul>
 <li>25–36 month plans: get approval from <strong>Jared Webb</strong> or <strong>Vanessa Valdivia</strong> via email <em>before</em> working out details with the resident; approval must be notated in Entrata.</li>
 <li>We do not offer plans over 36 months except by court judgment. For unusual large-balance situations, send a request (with payment amount/number and the circumstances) to Jared Webb and Bethany McCauslin for potential approval by Jacqui Shapiro. Leadership will review the ledger/activity history for prior broken promises before escalating.</li>
 </ul>
 <h4>Other rules</h4><ul><li>Split payment plans are not authorized.</li><li>If plan details change (new card, new expiration date, etc.), don't discard the old paperwork — attach the new sheet on top of the original.</li></ul>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"Settlement & Collections", title:"Payment Plan Default Process", tags:"payment plan default declined payment 48 hours reachable unreachable third party",
 body:`<h4>If a scheduled payment is declined</h4><p>Call the account holder to let them know. If reached, they have three options:</p>
 <ol>
 <li>Provide a different payment method or confirm funds are available within 48 hours — the payment is then run and the plan continues.</li>
 <li>If they haven't changed the plan before, a one-time change is allowed (amount, due date, etc.) — must be manager-approved and can't violate base payment plan rules.</li>
 <li>If they can no longer keep the plan and options i/ii don't apply, the file goes to professional collections — communicate this to the account holder, and call any other lease holders first to offer them the same options.</li>
 </ol>
 <h4>If the account holder can't be reached</h4><ul>
 <li>Call and leave a message asking for a callback that day.</li>
 <li>If no callback, call and email all lease holders again 24 hours after the original attempt.</li>
 <li>If there's still no response within 48 hours of the decline, the file is sent to professional collections as a default.</li>
 </ul>
 <p>Once a plan is officially in default, destroy the paper copy and notate Entrata.</p>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"Escalation & Case Handling", title:"Dispute Process — Valid vs. Invalid & Escalation SLA", tags:"dispute valid invalid escalation 72 hours lauren deliefde zach hebein community manager", priority:true,
 body:`<h4>Invalid disputes (can usually be clarified on the call)</h4><ul>
 <li>Final utilities</li><li>Correctly charged notice fee</li><li>Correctly charged termination fee</li>
 <li>Fee-waiver requests based on a prior conversation with no paperwork support</li>
 <li>Fee-waiver requests based on something that happened while living there (e.g., "my bathroom flooded so remove the blinds charge")</li>
 </ul>
 <h4>Valid disputes (send to onsite team for clarification)</h4><ul>
 <li>Need photos to support cleaning/damage charges</li><li>Need invoices to support cleaning/damage charges</li>
 <li>A notice was entered incorrectly and the fee needs revising</li>
 <li>A valid military or coast-to-coast transfer was accidentally charged a termination fee</li>
 </ul>
 <h4>Step-by-step once a dispute is valid</h4><ol>
 <li>Note the account <code>CCAMS-NI</code> in Entrata (so it shows on the agent tracking report).</li>
 <li>Email the Community Manager and generic property email, CC'ing the RPM, Director of Ops, Area Finance Manager, AFO, AVP, and CCAMS Supervisor. East region → CC Lauren Deliefde; West region → CC Zach Hebein.</li>
 <li>If no response within <strong>72 business hours</strong>, open the FMO, remove the disputed amount, and close the FMO.</li>
 <li>Once the onsite team responds, communicate the outcome to the resident and acknowledge the community's reply.</li>
 <li>If a balance remains, contact the resident the next business day to discuss payment options.</li>
 </ol>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"Settlement & Collections", title:"When a File Gets Sent to Professional (3rd-Party) Collections", tags:"third party collections trigger 60 days two contacts no contact info default no further contact",
 body:`<h4>Direct answer</h4><p>A file leaves CCAMS for outside collections within 60 days if any of the following are true: two contact attempts have been made with no resolution, there's no good contact info on file, a payment plan has defaulted, or the resident has asked for no further contact. Files stay in-house as long as there's an active dispute or active payment plan.</p>
 <h4>Where it goes</h4><p>Colorado files → Continental Collections Agency (cradle-to-grave, no fixed placement date). All other states → current forward-flow agency, placed monthly on the 18th with funding by the 23rd. Florida files must be held 16 days after move-out before placement.</p>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"Move-Out & Charges", title:"State-Specific Re-Rent / Termination Fee Rules", tags:"re-rent california florida pennsylvania massachusetts north carolina colorado termination notice fee state rules",
 body:`<h4>California</h4><ul><li>Re-rents tracked/revised on Mondays per CA state guidelines.</li><li>Charged through lease end, then revised for vacancy dates only (including the notice fee).</li><li>Can only charge the termination fee <em>or</em> the notice fee — never both.</li></ul>
 <h4>Florida</h4><ul><li>Tracked/revised on Mondays per FL guidelines.</li><li>Option E: 2-month termination fee. Option F: charged month-by-month until lease end or re-rent.</li><li>Can only charge the termination fee <em>or</em> the notice fee — never both.</li></ul>
 <h4>Pennsylvania</h4><ul><li>Hold anything with a move-out reason of "Eviction" for 30 days.</li><li>Day 31, it can be placed with CCAMS for collection, and can be sold as needed.</li></ul>
 <h4>Massachusetts / North Carolina / Colorado</h4><ul><li>Termination fee handled like California — can charge a 2-month termination fee, but must be revised for days of vacancy before assigning to CCAMS or selling to a third party.</li><li>Can only charge the termination fee <em>or</em> the notice fee — never both.</li></ul>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"Reporting & Systems", title:"CCAMS Activity Codes — Quick Reference", tags:"activity codes CFC CTC EFC ETC CTA CFA AEX CAGNT entrata notation",
 body:`<h4>Contact codes</h4><ul>
 <li><code>CCAMS-CFC TT/LV/HU</code> — call FROM prior resident: spoke to / left voicemail / hung up on</li>
 <li><code>CCAMS-CTC TT/LV/WN</code> — call TO prior resident: spoke to / left voicemail / wrong-no number</li>
 <li><code>CCAMS-EFC EM</code> / <code>CCAMS-ETC EM</code> — email FROM / TO prior resident, copied into Entrata</li>
 <li><code>CCAMS-CTA / CFA / ETA / EFA</code> — same pattern, but with an attorney</li>
 <li><code>CCAMS-CTP / CFP / ETP / EFP</code> — same pattern, but with Air/Aimco (property, legal, risk, etc.)</li>
 </ul>
 <h4>Outcome codes</h4><ul>
 <li><code>CCAMS-PIF</code> — paid in full</li><li><code>CCAMS-PP</code> — payment plan or partial payment</li><li><code>CCAMS-PP Filed</code> — payment plan filed</li>
 <li><code>CCAMS-AEX</code> — refusal to pay/unable to make contact, sending to professional collections</li>
 <li><code>AEX SMLBAL</code> — balance under $250, will not be sent to collections</li>
 <li><code>CCAMS-AEX Verify Gone and Close</code> — sold property, do not accept payment, refer to Genesis (3rd-party agency)</li>
 </ul>
 <h4>Assignment codes</h4><p><code>CCAMS-CAGNT1–4</code> = active files assigned to each Collections Specialist; <code>CCAMS-CAGNT5–8</code> = the same specialists' <strong>aged</strong> accounts (this is the tab referenced in the Settlement Worksheet SOP).</p>
 <h4>Source</h4><p class="src">CCAMS Processes Manual, Appendix C (July 2019, updated 11/18/2025) — note some CAGNT name assignments in the appendix may be outdated; confirm current agent mapping with your supervisor.</p>`},

{cat:"Escalation & Case Handling", title:"How New Past-Resident Files Reach CCAMS & Get Assigned", tags:"file receipt daily admin tracking report WNR assignment split volume",
 body:`<h4>Direct answer</h4><p>Files land with CCAMS automatically once the FMO is completed with a balance, via the "Daily CCAMS Admin Tracking Report."</p>
 <h4>Process</h4><ol>
 <li>Files are sorted by ledger balance; anything at $0 or less is reviewed for a payment or placement error.</li>
 <li>If paid in full, that's accounted for during upload. If revised before collections activity started, note <code>CCAMS - WNR</code> ("will not receive").</li>
 <li>Otherwise, an activity note (<code>CCAMS - CAGNT1/2/3/4</code>) is entered once the balance is verified.</li>
 <li>If a Collections Specialist already had verbal contact with the resident (a CCAMS-TT note exists), the file goes back to that same specialist. Otherwise, files are split as evenly as possible across specialists by balance/volume.</li>
 </ol>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"Escalation & Case Handling", title:"Contacting Past Residents — Order of Methods & Emergency Contact Rules", tags:"contact methods phone email emergency contact attorney letter of representation once",
 body:`<h4>Priority order</h4><ol><li>Phone — try every number on file.</li><li>Email — using internal templates if an address is available.</li><li>Emergency Contact — only if the resident can't be reached any other way.</li></ol>
 <h4>Emergency Contact rules</h4><ul><li>No account information can be shared beyond asking the EC to relay a callback request.</li><li>An Emergency Contact can only be contacted once (one call or message, total).</li></ul>
 <h4>If an attorney contacts you on the resident's behalf</h4><p>You need a letter of representation on company letterhead before working with them. Recommend the attorney include all disputed items in that same letter to speed things up.</p>
 <h4>Source</h4><p class="src">CCAMS Processes Manual (July 2019, updated 11/18/2025)</p>`},

{cat:"SSC Directory", title:"Team Meeting Notes — SSC Expansion & Reminders (7/30/26)", tags:"ssc expansion careers tab account notes duplicated email refund follow up urgent 2nd request",
 body:`<h4>SSC is expanding</h4><p>Watch the Careers tab for new roles as the SSC grows — apply, or pass it along to anyone who might be a fit.</p>
 <h4>Reminders</h4><ul>
 <li>Read account notes before doing any further work on a case.</li>
 <li>If an email is an escalation/legal-involvement thread, loop in Jared and Tina. If it's a priority email they need to see, send it from your personal email (not the CCAMS inbox) — it increases visibility on the thread.</li>
 <li>Avoid back-and-forth: anticipate the next likely question and answer it in the same email.</li>
 <li>Be confident in your emails — we're the subject matter experts.</li>
 <li>Archive completed emails rather than leaving them in your inbox; if you'll need it later, use a subfolder or upload it to the account with a calendar reminder.</li>
 <li>Check for duplicate emails in a thread so you're not missing account context.</li>
 </ul>
 <h4>Chat & priority reminders</h4><ul><li>Delete a chat request once it's been handled — keep the channel clean.</li><li>Chime in for remote teammates' requests if you know (or think you know) the answer.</li><li>Need immediate help? Tag someone to hop on a call if they're marked available ("green").</li>
 <li>Priority order for accounts: 1) Initial AIR Accounts, 2) PAC Accounts, 3) Settlement Campaign Accounts, 4) Pay Ready Accounts.</li></ul>
 <h4>Refund follow-up detail</h4><p>Follow up on a refund request every 3 days if there's no response. On the 2nd follow-up, mark the email "Urgent" and add "2nd Request" to the subject line.</p>
 <h4>PAC/transition note</h4><p>When speaking with PAC customers, always say we're "speaking on behalf of PAC" — never that we <em>are</em> PAC. Tina and Jared circulate a transition-accounts list (upcoming units/communities, transition dates, previous management) to set workflow expectations.</p>
 <h4>Source</h4><p class="src">Team Meeting Notes, 7/30/26</p>`},

{cat:"SSC Directory", title:"Voiced Team Concerns & Proposed Solutions (7/30/26)", tags:"voiced concern admin day phone hours remote coworker response time proposed solution",
 body:`<h4>Concern: not enough time for admin work</h4><p>Team flagged that queue volume leaves too little time for admin tasks like email support.</p><p><strong>Proposed solution:</strong> an Admin Day or readjusted phone hours — Jared and Tina to discuss further and follow up.</p>
 <h4>Concern: slow response to remote coworkers</h4><p>Remote teammates' requests weren't always being answered in a timely way.</p><p><strong>Proposed solution:</strong> follow the "In CCAMS General Chat Processes" guidance — chime in when you know (or think you know) an answer, and stay as active as possible in the group chat.</p>

{cat:"Escalation & Case Handling", title:"Worked Example — Sub-$200 Deposit Dispute on a Transitioned (PAC/Bell) Property", tags:"worked example deposit dispute pay ready bell pac transition james trojan small claims practical resolution",
 body:`<h4>Situation</h4><p>A former resident of a Bell-managed property (later transitioned to PAC) sent a formal demand for return of a $200 security deposit, citing a state law requiring an itemized final account statement within 30 days of move-out. The unresolved balance had instead been routed to a collections vendor days after move-out.</p>
 <h4>How it played out</h4><ul>
 <li>Neither the prior operator (Bell) nor the new operator (PAC/AIR) could confirm the deposit had been sent or that a final statement was mailed.</li>
 <li>Given the amount was under $200 and neither side could substantiate its position, leadership (Tina Ladson) agreed that resolving/reissuing the amount was the most practical path rather than risking further escalation, cost, or a regulatory/small-claims filing.</li>
 <li>The SSC (via the shared CCAMS inbox) served as the centralized point of contact between the legacy manager, the new operator, and ownership representatives while the refund was issued.</li>
 </ul>
 <h4>Why this matters</h4><p>It's a real-world illustration of the "$200-or-less, can't substantiate our position, escalation costs more than the dispute" guidance — see "Dispute/Escalation Expectations."</p>
 <h4>Source</h4><p class="src">CCAMS Escalation & Resolution Expectations thread, 6/16/26</p>`},

{cat:"Move-Out & Charges", title:"Paint Charge Pro-ration Schedule", tags:"paint proration schedule tenure months depreciation full paint charge",
 body:`<h4>Direct answer</h4><p>A resident's paint charge is prorated based on how many months they lived in the unit.</p>
 <h4>Schedule</h4><ul>
 <li>Months 1–24: charged at <strong>100%</strong> of the paint cost.</li>
 <li>Starting month 25, it declines by roughly 4.2 percentage points per month (e.g., 95.8% at month 25, 75% at month 30, 50% at month 36...).</li>
 <li>Month 48 (4 years) and beyond: <strong>0% — no paint charge.</strong></li>
 </ul>
 <h4>Source</h4><p class="src">Paint Pro-ration Schedule (spreadsheet)</p>`},

{cat:"Refunds", title:"Void / Stop Payment Form — When & Why to Use It", tags:"void stop payment form reasons AP wrong payee lost check duplicate reissue chargeback",
 body:`<h4>Direct answer</h4><p>Use the Void/Stop Payment form to have AP void or stop a check, then reissue if needed.</p>
 <h4>Available reasons</h4><ul>
 <li>Wrong amount</li><li>Chargeback</li><li>Wrong payee (send AR a copy of the form)</li><li>Mailed to the wrong address</li>
 <li>Lost/misplaced original check (attach stop payment)</li><li>Destroyed original check (attach stop payment)</li>
 <li>Duplicate payment</li><li>Payee refuses payment</li><li>Payee confirms amount isn't owed</li><li>Reissue same amount</li><li>Copy to AR</li><li>Other (explain)</li>
 </ul>
 <p>The form requires the AP representative initiating and the AP representative reviewing the void to both sign off, plus a signed statement affirming the reason is truthful.</p>
 <h4>Source</h4><p class="src">Void / Stop Payment Form (AP)</p>`},

{cat:"Approvals", title:"Attorney / Eviction Counsel Contacts by State", tags:"attorney contacts eviction counsel state directory law firm intake paralegal",
 body:`<h4>Direct answer</h4><p>The Attorney Contacts list is organized by state and lists, for each community group: the law firm, intake/paralegal contact, and primary attorney (with phone and email). Examples: AZ → C & W Law Group; several CA regions → Hollenbeck, PKS, or H&R depending on community; CO → SBWP or TSM; FL → MGFD; MA → ATL Law, Drayton Law, or SLG depending on community; MD → BBSG; NC → Johnson D'Atri; NY (173 E 90th St) → BBG; PA → Baritz KBK Law Group; VA → Walutes and Bedford or an independent attorney depending on community.</p>
 <h4>Use</h4><p>Look up the community's state, then match to the correct firm/contact before sending eviction or collections correspondence to outside counsel.</p>
 <h4>Source</h4><p class="src">Attorney Contacts list (spreadsheet, April 2026)</p>`},

{cat:"Refunds", title:"Payment Return Notice — Reasons a Payment Gets Sent Back", tags:"payment return notice no outstanding balance overpayment current resident paid in full restriction",
 body:`<h4>Direct answer</h4><p>Use the Payment Return Notice template to send an unacceptable payment back to a resident, checking the applicable reason:</p>
 <ul>
 <li><strong>No Outstanding Balance</strong> — nothing due on the account.</li>
 <li><strong>Payment Exceeds the Amount Due</strong> — can't process an overpayment.</li>
 <li><strong>Current Resident</strong> — active residents must pay via the leasing office or resident portal, not CCAMS.</li>
 <li><strong>Payment Marked "Paid in Full"</strong> — restrictive endorsement without an approved settlement/written agreement; returned unapplied.</li>
 <li><strong>Other</strong> — explain.</li>
 </ul>
 <h4>Source</h4><p class="src">Payment Return Notice (template)</p>`},

{cat:"CCAMS FAQs", title:"How should we respond when a resident's cleaning invoice conflicts with inspection photos showing insufficient cleaning?", tags:"faq ccams faqs respond resident's cleaning invoice conflicts inspection photos showing insufficient cleaning",
 body:`<h4>A</h4><p>Provide inspection photos to the resident, inform them that the professional cleaning did not meet standards, and advise disputing the charge with their cleaning company for a refund. Use the "cleaning invoice not valid" template.</p><h4>Confidence</h4><p>High — confirmed by Jared Webb and Vannesa Valdivia.</p><h4>Source</h4><p>Jared Webb, Vannesa Valdivia</p>`},

{cat:"CCAMS FAQs", title:"Are utility charges valid after a resident vacates early but before lease end?", tags:"faq ccams faqs utility charges valid after resident vacates early but before lease end",
 body:`<h4>A</h4><p>Yes. Minimum water/sewer charges apply, and utilities remain active until lease end, even if the unit is vacant. This explanation is confirmed by Jared Webb.</p><h4>Confidence</h4><p>High</p><h4>Source</h4><p>Jared Webb</p>`},

{cat:"CCAMS FAQs", title:"Is a double charge for move-out cleaning and painting valid?", tags:"faq ccams faqs double charge move-out cleaning painting valid",
 body:`<h4>A</h4><p>Confirmed as duplicate charges; the resident was charged twice. Ledger should be revised to remove duplication, per Vannesa Valdivia.</p><h4>Confidence</h4><p>High</p><h4>Source</h4><p>Vannesa Valdivia</p>`},

{cat:"CCAMS FAQs", title:"Should a fee for service after move-out be removed or prorated?", tags:"faq ccams faqs fee service after move-out removed prorated",
 body:`<h4>A</h4><p>Insufficient information in chat; no trainer response found. The question remains unresolved.</p><h4>Confidence</h4><p>Low</p>`},

{cat:"CCAMS FAQs", title:"Is a resident liable for 1-day rent if they move out before lease end?", tags:"faq ccams faqs resident liable 1-day rent they move out before lease end",
 body:`<h4>A</h4><p>Yes. The resident is responsible for the rent through the lease end date, regardless of physical move-out date.</p><h4>Confidence</h4><p>High</p><h4>Source</h4><p>(Not specified)</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How do we handle ePayment link failures or delays?", tags:"faq ssc & corporate ap faqs handle epayment link failures delays",
 body:`<h4>A</h4><p>When ePayment links fail to send or are delayed, the process involves verifying the status, working with PNC to resolve issues, and reissuing links or checks as needed. If the link cannot be sent, issuing a paper check with tracking is recommended. Follow-up communication and manual processes often resolve these delays.<br><br><em>Key Insight:</em> The team frequently works with PNC support, and checks may be reissued or manually processed. The 10-day link expiration and system errors are common issues.<br><br><em>Example:</em> For residents who didn't receive their link, the team reissued links, canceled failed requests, or issued checks with tracking.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How should refunds be reissued for residents from properties sold or transitioned?", tags:"faq ssc & corporate ap faqs refunds reissued residents from properties sold transitioned",
 body:`<h4>A</h4><p>Refunds for residents from properties sold or transitioned are complex. If the property was sold before the refund process, responsibility may transfer to the new management unless the liability was explicitly transitioned. If the resident's check was returned, or the refund was not sent, the team may need to manually reissue via ePayment or check, often requiring supporting documentation (e.g., final FMO, email proof).<br><br><em>Key Insight:</em> Many refunds require verification of whether the liability transferred and whether the original check was issued or cashed. If the check is uncashed or lost, reissuance is typically authorized after confirmation.<br><br><em>Example:</em> For residents like Liang Tian or Christina Kaak, the team confirms if the check was cashed or escheated before reissuing.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How do we verify whether a refund check has been cashed?", tags:"faq ssc & corporate ap faqs verify whether refund check has been cashed",
 body:`<h4>A</h4><p>Check the status in the banking system, PNC portal, or internal records. If the check is not cashed and no evidence of payment is found, a reissue can be authorized. If the check was cashed, the refund is considered fulfilled.<br><br><em>Key Point:</em> The team confirms status through bank records, PNC, or internal logs, then proceeds accordingly—either reissuing or closing the case.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"What is the process if a resident claims they did not receive their refund link or check?", tags:"faq ssc & corporate ap faqs process resident claims they did not receive refund link check",
 body:`<h4>A</h4><p>Verify email delivery via the CSV report, check for system issues, and confirm whether the link was sent. If necessary, cancel the original request and reissue the link or check. If residents are outside the country or have email issues, checks may be reissued with tracking.<br><br><em>Key Insight:</em> Multiple residents experienced issues with email links, especially due to delays, system errors, or email filtering. Reissuance or manual checks are common solutions.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How do we handle reissuance requests for residents from properties prior to our management?", tags:"faq ssc & corporate ap faqs handle reissuance requests residents from properties prior our management",
 body:`<h4>A</h4><p>For properties sold or transitioned before our tenure, responsibility for refunds often lies with the previous management unless liability was explicitly transferred. To proceed, supporting documentation such as FMO, final ledger, or email proof is needed.<br><br><em>Example:</em> For residents of Waterford Village in 2023, the team considers whether the liability transferred and requests documentation before reissuing.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How do we handle duplicate or incorrect checks?", tags:"faq ssc & corporate ap faqs handle duplicate incorrect checks",
 body:`<h4>A</h4><p>When duplicate checks are identified, confirm if only one was processed, then shred or cancel the duplicates. If a check was issued with incorrect payee info, void and reissue the check with proper authorization, including any required written consent, especially for payee changes like embassy requests.<br><br><em>Key Point:</em> Proper documentation (e.g., death certificate, written consent) is required for payee changes or to reissue to third parties such as embassies.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How do we process refunds for residents who are deceased or have special circumstances?", tags:"faq ssc & corporate ap faqs process refunds residents deceased have special circumstances",
 body:`<h4>A</h4><p>For deceased residents, a check can be reissued to the estate with the proper documentation (death certificate, estate proof). For embassy refunds, written consent from the leaseholder (or the leaseholder's email approval) is sufficient for reissuance.<br><br><em>Note:</em> SOPs not explicitly provided, guidance based on supervisor input.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How do we handle refunds when a resident moves out long ago (e.g., 2015)?", tags:"faq ssc & corporate ap faqs handle refunds resident moves out long ago e.g 2015",
 body:`<h4>A</h4><p>If the refund is from a long-past date, the likelihood is the funds are escheated or with the state. Responsibility depends on whether the liability was transferred. Such cases usually require legal or state intervention and are often outside the scope of current management.<br><br><em>Example:</em> For residents from 2015, the team indicates the funds have likely escheated.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How do we manage delays or failures in ePayment processing?", tags:"faq ssc & corporate ap faqs manage delays failures epayment processing",
 body:`<h4>A</h4><p>The process involves verifying the delay, working with PNC support, and manually reissuing links or checks. If the link was not sent or failed, reissuing with updated information or checks with tracking is advised.<br><br><em>Insight:</em> System issues, delays, or email filtering cause repeated failures. Proactive reissuance minimizes resident frustration.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"What is the SOP for handling refunds when the property has transitioned or been sold?", tags:"faq ssc & corporate ap faqs sop handling refunds property has transitioned been sold",
 body:`<h4>A</h4><p>Responsibility for refunds depends on the move-out date relative to the transition date. If the move-out was before the property transferred, the previous management handles refunds. If after, current management handles them, provided the liability was transferred.<br><br><em>Note:</em> Documentation like FMO, final ledger, or email proof is vital for validation.</p>`},

{cat:"SSC & Corporate AP FAQs", title:"How to process a move-out or refund when the property has transitioned or been sold?", tags:"faq ssc & corporate ap faqs process move-out refund property has transitioned been sold",
 body:`<h4>A</h4><p>Responsibility depends on move-out date relative to sale; if prior to transition, responsibility lies with the previous operator, otherwise current management. Supporting documentation is required.</p>`},

const grid = document.getElementById('results');
const countEl = document.getElementById('resultCount');
const searchBox = document.getElementById('searchBox');
const filterRow = document.getElementById('filterRow');

const cats = [...new Set(data.map(d=>d.cat))];
let activeCat = null;

cats.forEach(c=>{
  const chip = document.createElement('div');
  chip.className='chip';
  chip.textContent = c;
  chip.onclick = ()=>{
    activeCat = (activeCat===c) ? null : c;
    [...filterRow.children].forEach(ch=>ch.classList.remove('active'));
    if(activeCat) chip.classList.add('active');
    render();
  };
  filterRow.appendChild(chip);
});

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q){
  if(!q) return text;
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return text.replace(re, '<mark>$1</mark>');
}

function render(){
  const q = searchBox.value.trim().toLowerCase();
  let list = data;
  if(activeCat) list = list.filter(d=>d.cat===activeCat);
  if(q){
    list = list.filter(d =>
      d.title.toLowerCase().includes(q) ||
      d.tags.toLowerCase().includes(q) ||
      d.body.toLowerCase().includes(q) ||
      d.cat.toLowerCase().includes(q)
    );
  }
  countEl.textContent = list.length + (list.length===1 ? ' result' : ' results') + (activeCat ? (' in "'+activeCat+'"') : '');
  grid.innerHTML='';
  if(list.length===0){
    grid.innerHTML = '<div class="empty">No matches. Try a different keyword — e.g. "refund", "military", "settlement", "RRLC".</div>';
    return;
  }
  list.forEach((d,i)=>{
    const card = document.createElement('div');
    card.className = 'card' + (d.priority ? ' priority':'');
    const titleHtml = highlight(escapeHtml(d.title), q);
    const catHtml = highlight(escapeHtml(d.cat), q);
    card.innerHTML = `
      <div class="card-head" data-idx="${i}">
        <div><span class="card-cat">${catHtml}</span><span class="card-title">${titleHtml}</span></div>
        <span class="arrow">▶</span>
      </div>
      <div class="card-body">${d.body}</div>
    `;
    card.querySelector('.card-head').onclick = ()=>{
      card.classList.toggle('open');
    };
    grid.appendChild(card);
  });
  // auto-open matches when actively searching
  if(q){
    [...grid.querySelectorAll('.card')].forEach(c=>c.classList.add('open'));
  }
}

searchBox.addEventListener('input', render);
render();
</script>
</body>
</html>
